{% extends "base.html" %}
{% block title %}Fehler {{ status }}{% endblock %}
{% block content %}
<div class="text-center py-5">
  <div class="display-1 text-secondary"><i class="fa-regular fa-face-frown"></i></div>
  <h1 class="mt-3">{% if status == 404 %}Nicht gefunden{% elif status == 403 %}Kein Zugriff{% elif status == 429 %}Zu viele Versuche{% else %}Das hat nicht geklappt{% endif %}</h1>
  <p class="lead text-secondary">{{ detail }}</p>
  <a class="btn btn-primary" href="/"><i class="fa-solid fa-house me-1"></i>Zur Übersicht</a>
</div>
{% endblock %}
