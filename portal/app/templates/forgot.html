{% extends "base.html" %}
{% block title %}Passwort vergessen – {{ product }}{% endblock %}
{% block body %}
<div class="login-wrap">
  <div class="login">
    <div class="brand"><span class="brand-lamp" aria-hidden="true"></span><span><strong>{{ brand }}</strong><small>{{ product }}</small></span></div>
    {% for m in messages %}<div class="flash {{ m.kind }}" role="status">{{ m.text }}</div>{% endfor %}
    <form class="panel" method="post" action="/forgot">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <p>Wir schicken Ihnen einen Link zum Festlegen eines neuen Passworts.</p>
      <div class="field">
        <label for="email">E-Mail</label>
        <input id="email" name="email" type="email" autocomplete="username" required autofocus>
      </div>
      <button type="submit">Link anfordern</button>
    </form>
    <p class="muted small"><a href="/login">Zurück zur Anmeldung</a></p>
  </div>
</div>
{% endblock %}
