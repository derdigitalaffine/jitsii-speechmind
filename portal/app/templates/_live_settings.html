    <div class="card"><div class="card-header"><i class="fa-solid fa-sliders me-2"></i>Einstellungen</div>
      <form class="card-body" data-unsaved method="post" action="/votes/live/{{ poll.id }}/settings"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="return_tab" value="settings">
        <label class="form-label small" for="ls-t">Titel</label><input class="form-control mb-2" id="ls-t" name="title" value="{{ poll.title }}" maxlength="255">
        <label class="form-label small" for="ls-d">Begrüßung <span class="text-secondary">(sehen Teilnehmende)</span></label><textarea class="form-control mb-2" id="ls-d" name="description" rows="2" maxlength="2000">{{ poll.description }}</textarea>
        <fieldset class="mb-2"><legend class="form-label small">Ablauf</legend>{% for k, v in pacing.items() %}
          <div class="form-check"><input class="form-check-input" type="radio" name="pacing" id="ls-p-{{ k }}" value="{{ k }}" {% if poll.pacing == k %}checked{% endif %}><label class="form-check-label" for="ls-p-{{ k }}">{{ v[0] }} <span class="small text-secondary d-block">{{ v[1] }}</span></label></div>{% endfor %}</fieldset>
        <button class="btn btn-primary" type="submit">Einstellungen speichern</button>
      </form>
    </div>
